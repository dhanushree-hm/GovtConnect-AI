<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | GovtConnect AI</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><main class="form-page"><a class="brand" href="{{ url_for('home') }}">GovtConnect<span class="brand-ai"> AI</span></a><section class="form-card"><p class="eyebrow">GET STARTED</p><h1>Create your account</h1><p>Join GovtConnect AI and discover opportunities made for you.</p>{% include '_flashes.html' %}
<form method="post" action="{{ url_for('register') }}"><h2>Account details</h2><label for="full_name">Full name</label><input id="full_name" name="full_name" maxlength="150" autocomplete="name" required value="{{ request.form.get('full_name','') }}"><label for="email">Email</label><input id="email" name="email" type="email" maxlength="254" autocomplete="email" required value="{{ request.form.get('email','') }}"><label for="password">Password</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required><p class="form-hint">Use at least 8 characters.</p><h2>Student profile <span class="optional">(optional)</span></h2><div class="field-grid"><div><label for="date_of_birth">Date of birth</label><input id="date_of_birth" name="date_of_birth" type="date" value="{{ request.form.get('date_of_birth','') }}"></div><div><label for="state">State</label><input id="state" name="state" value="{{ request.form.get('state','') }}" placeholder="e.g. Karnataka"></div><div><label for="education_level">Education level</label><input id="education_level" name="education_level" value="{{ request.form.get('education_level','') }}" placeholder="e.g. Undergraduate"></div><div><label for="course">Course</label><input id="course" name="course" value="{{ request.form.get('course','') }}"></div><div><label for="institution">Institution</label><input id="institution" name="institution" value="{{ request.form.get('institution','') }}"></div><div><label for="annual_income">Annual family income (₹)</label><input id="annual_income" name="annual_income" type="number" min="0" step="0.01" value="{{ request.form.get('annual_income','') }}"></div></div><button class="button button-primary" type="submit">Create account</button></form><p class="form-switch">Already registered? <a href="{{ url_for('login') }}">Log in</a></p></section></main></body></html>
