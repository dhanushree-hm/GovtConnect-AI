<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log in | GovtConnect AI</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><main class="form-page"><a class="brand" href="{{ url_for('home') }}">GovtConnect<span class="brand-ai"> AI</span></a><section class="form-card"><p class="eyebrow">WELCOME BACK</p><h1>Log in</h1><p>Continue exploring opportunities for your next step.</p>{% include '_flashes.html' %}<form method="post"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required value="{{ request.form.get('email','') }}"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required><button class="button button-primary" type="submit">Log in</button></form><p class="form-switch">New to GovtConnect? <a href="{{ url_for('register') }}">Create an account</a></p></section></main></body></html>
