<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Manage opportunity | GovtConnect AI</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><main class="form-page"><a class="brand" href="{{ url_for('opportunity_list') }}">GovtConnect<span class="brand-ai"> AI</span></a><section class="form-card wide-card"><p class="eyebrow">OPPORTUNITY MANAGEMENT</p><h1>{{ 'Edit opportunity' if opportunity and opportunity.get('opportunity_id') else 'Add opportunity' }}</h1>{% include '_flashes.html' %}<form method="post"><label for="title">Title</label><input id="title" name="title" required value="{{ opportunity.title or opportunity.name or '' }}"><label for="type">Type</label><select id="type" name="type"><option value="Scholarship" {% if opportunity.category == 'Scholarship' %}selected{% endif %}>Scholarship</option><option value="Scheme" {% if opportunity.category == 'Scheme' %}selected{% endif %}>Scheme</option><option value="Exam" {% if opportunity.category == 'Exam' %}selected{% endif %}>Exam</option></select><label for="state">State or region</label><input id="state" name="state" placeholder="Karnataka or All India" value="{{ opportunity.state or '' }}"><label for="description">Description</label><textarea id="description" name="description" rows="5">{{ opportunity.description or '' }}</textarea><div class="field-grid"><div><label for="deadline">Application deadline</label><input id="deadline" name="deadline" type="date" value="{{ opportunity.deadline.isoformat() if opportunity.deadline and opportunity.deadline.isoformat is defined else opportunity.deadline or '' }}"></div><div><label for="link">Official URL</label><input id="link" name="link" type="url" value="{{ opportunity.link or '' }}"></div></div><h2>Eligibility criteria</h2><label for="required_state">Required state (optional)</label><input id="required_state" name="required_state" value="{{ criteria.required_state or criteria.state or '' }}"><label for="minimum_education">Minimum education (optional)</label><input id="minimum_education" name="minimum_education" value="{{ criteria.minimum_education or criteria.min_education_level or '' }}"><label for="max_annual_income">Maximum annual family income (optional)</label><input id="max_annual_income" name="max_annual_income" type="number" min="0" step="0.01" value="{{ criteria.max_annual_income or '' }}"><button class="button button-primary" type="submit">Save opportunity</button></form></section></main></body></html>
